<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>風洞小工程師</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0d1117; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #e6edf3; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; gap: 18px; }
      #loading h1 { margin: 0; font-size: 34px; letter-spacing: 2px; }
      #loading p { margin: 0; font-size: 15px; color: #8b98a9; }
      #bar { width: min(360px, 70vw); height: 10px; border-radius: 5px; background: #21262d; overflow: hidden; }
      #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2f81f7, #56d4dd); transition: width .2s; }
      #error { color: #ff7b72; max-width: 80vw; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>風洞小工程師</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <p id="status">載入中…第一次開啟需要下載約數十 MB，請稍候</p>
    </div>
    <script src="Build/WindTunnelEngineer_WebBuild.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WindTunnelEngineer_WebBuild.data.unityweb",
        frameworkUrl: "Build/WindTunnelEngineer_WebBuild.framework.js.unityweb",
        codeUrl: "Build/WindTunnelEngineer_WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tianfeng Lab",
        productName: "風洞小工程師",
        productVersion: "1.0",
        // 高解析度螢幕最多用 1.5 倍像素，避免筆電跑不動
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      }, function (progress) {
        document.querySelector("#bar-fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        var s = document.querySelector("#status");
        s.id = "error";
        s.textContent = "載入失敗：" + message + "（請用最新版的 Chrome、Edge 或 Firefox 開啟）";
      });
    </script>
  </body>
</html>
